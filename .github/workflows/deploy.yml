name: Deploy to Render

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # RENDER_DEPLOY_HOOK_URL is stored in GitHub → Settings → Secrets and variables → Actions
        # Get the hook URL from: Render dashboard → your service → Settings → Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
