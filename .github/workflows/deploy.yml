name: Deploy to Namecheap

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ui/ to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ui/
          server-dir: /public_html/tools/isentropic/
          protocol: ftps      # explicit FTPS on port 21 (encrypted login and data)
          security: strict    # verify the server certificate; FTP_SERVER must be the host's own name
          exclude: |
            **/.git*
            **/.git*/**
