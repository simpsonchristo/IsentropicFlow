name: FTP probe
on:
  push:
    branches: ["diag/ftp-probe"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe explicit FTPS (read-only, no uploads)
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          W: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os, ssl
          def attempt(label, host, verify):
              print("---", label)
              try:
                  ctx = ssl.create_default_context()
                  if not verify:
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                  f = ftplib.FTP_TLS(context=ctx, timeout=20)
                  f.connect(host, 21)
                  f.auth()
                  print("TLS control channel:", f.sock.version(), f.sock.cipher()[0])
                  f.login(os.environ["U"], os.environ["W"])
                  f.prot_p()
                  print("login OK; data channel protected; PWD", f.pwd())
                  print("list /public_html:", f.nlst("/public_html")[:8])
                  f.quit()
              except Exception as e:
                  print("FAILED:", type(e).__name__, str(e)[:200])
          attempt("A: $FTP_SERVER, certificate verified", os.environ["H"], True)
          attempt("B: server267.web-hosting.com, certificate verified", "server267.web-hosting.com", True)
          attempt("C: $FTP_SERVER, encryption only (no cert check)", os.environ["H"], False)
          PY
