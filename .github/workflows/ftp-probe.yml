name: FTP probe
on:
  push:
    branches: ["diag/ftp-probe"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FTP account (read-only)
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          W: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          f = ftplib.FTP(os.environ["H"], timeout=20)
          f.login(os.environ["U"], os.environ["W"])
          def show(label, fn):
              try: print(label, "->", fn())
              except Exception as e: print(label, "-> ERROR", e)
          show("PWD", f.pwd)
          show("NLST .", lambda: f.nlst())
          for p in ["/", "..", "/..", "../..", "/public_html", "/home", "/tools"]:
              def go(p=p):
                  f.cwd("/")
                  f.cwd(p)
                  return "cwd ok, pwd=%s list=%s" % (f.pwd(), f.nlst()[:15])
              show("CWD " + p, go)
          f.quit()
          PY
